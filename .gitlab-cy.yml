image: node:18

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci
    - npm run build        # builds into `build/`
    - mv build public      # Pages requires `public/`
  artifacts:
    paths:
      - public
  only:
    - main

pages:
  stage: deploy
  script:
    - echo "Deploying to GitLab Pages"
  dependencies:
    - build
  artifacts:
    paths:
      - public
  only:
    - main
